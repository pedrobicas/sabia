# Configuração do Sabiá.
# Tudo que muda entre ambientes vem de variáveis de ambiente (veja .env.example na raiz do projeto).

spring:
  application:
    name: sabia
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/sabia}
    username: ${DB_USERNAME:sabia}
    password: ${DB_PASSWORD:sabia}
  jpa:
    open-in-view: false
    hibernate:
      # O esquema é responsabilidade do Flyway (src/main/resources/db/migration).
      ddl-auto: none
  flyway:
    placeholders:
      # Dimensão dos vetores de embedding. Precisa bater com o modelo de embedding usado.
      dimensoes: ${EMBEDDING_DIMENSIONS:1024}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  mvc:
    async:
      request-timeout: 180s
  ai:
    # Cliente da OpenAI apontando para qualquer API compatível.
    # Padrão: Ollama rodando local (http://localhost:11434). Na nuvem: OpenAI ou Gemini.
    openai:
      base-url: ${IA_BASE_URL:http://localhost:11434}
      api-key: ${IA_API_KEY:ollama}
      chat:
        completions-path: ${IA_CHAT_PATH:/v1/chat/completions}
        options:
          model: ${IA_MODELO_CHAT:qwen2.5:3b}
          temperature: 0.2
      embedding:
        embeddings-path: ${IA_EMBEDDINGS_PATH:/v1/embeddings}
        options:
          model: ${IA_MODELO_EMBEDDING:bge-m3}
          # Opcional. Vazio = o tamanho padrão do modelo. Preenchido (igual a EMBEDDING_DIMENSIONS), pede vetores
          # menores a provedores que aceitam o parâmetro "dimensions", como o text-embedding-3 da OpenAI.
          dimensions: ${IA_EMBEDDING_DIMENSOES_PEDIDAS:}
    vectorstore:
      pgvector:
        # A tabela é criada pelo Flyway (V2), com a dimensão de EMBEDDING_DIMENSIONS.
        initialize-schema: false
        table-name: vector_store
        dimensions: ${EMBEDDING_DIMENSIONS:1024}
        distance-type: COSINE_DISTANCE
        index-type: HNSW

server:
  port: ${PORT:8080}
  # Necessário atrás do proxy das plataformas de nuvem (Render, Railway etc.).
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health

sabia:
  jwt:
    segredo: ${JWT_SEGREDO:troque-este-segredo-local-por-um-com-32-caracteres-ou-mais}
    validade: ${JWT_VALIDADE:12h}
  cadastro-aberto: ${CADASTRO_ABERTO:true}
  limite-perguntas-por-hora: ${LIMITE_PERGUNTAS_POR_HORA:30}
  # Fuso usado para agrupar as perguntas por dia no painel de análises.
  fuso-horario: ${FUSO_HORARIO:America/Sao_Paulo}
  login:
    # Senhas erradas permitidas por e-mail e por IP antes do bloqueio temporário (429).
    tentativas-por-email: ${LOGIN_TENTATIVAS_POR_EMAIL:5}
    tentativas-por-ip: ${LOGIN_TENTATIVAS_POR_IP:30}
    janela-minutos: ${LOGIN_JANELA_MINUTOS:15}
  rag:
    trechos-por-busca: ${RAG_TRECHOS_POR_BUSCA:5}
    similaridade-minima: ${RAG_SIMILARIDADE_MINIMA:0.4}
    tamanho-trecho: ${RAG_TAMANHO_TRECHO:1200}
    sobreposicao: ${RAG_SOBREPOSICAO:200}
  cors:
    origens: ${CORS_ORIGENS:}
  demo:
    habilitada: ${DEMO_HABILITADA:false}
    # Perguntas por hora que chegam ao modelo de IA, somando todos os visitantes da demonstração (0 desliga).
    limite-perguntas-por-hora: ${DEMO_LIMITE_PERGUNTAS_POR_HORA:200}
    # Contas temporárias de demonstração que um mesmo IP pode criar por hora (0 desliga).
    visitantes-por-ip-por-hora: ${DEMO_VISITANTES_POR_IP_POR_HORA:20}
