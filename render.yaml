# Blueprint da Render: sobe a demonstração pública do Sabiá a partir do Dockerfile da raiz.
# O banco (PostgreSQL com pgvector) fica fora da Render, no Neon, na região AWS US East 1.
# Na criação, a Render pede os valores marcados com sync: false.

services:
  - type: web
    name: sabia
    runtime: docker
    plan: free
    # Mesma região do banco (Neon aws-us-east-1), para a busca não pagar latência entre os dois.
    region: virginia
    healthCheckPath: /actuator/health
    envVars:
      # Banco, no formato JDBC: jdbc:postgresql://HOST/BANCO?sslmode=require (conexão direta, sem pooler)
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: JWT_SEGREDO
        generateValue: true

      # Gemini pela API compatível com a da OpenAI.
      - key: IA_BASE_URL
        value: https://generativelanguage.googleapis.com/v1beta/openai
      - key: IA_CHAT_PATH
        value: /chat/completions
      - key: IA_EMBEDDINGS_PATH
        value: /embeddings
      - key: IA_API_KEY
        sync: false
      - key: IA_MODELO_CHAT
        value: gemini-3.5-flash-lite
      - key: IA_MODELO_EMBEDDING
        value: gemini-embedding-001
      # Tamanho padrão do gemini-embedding-001. Acima de 2000, a migração V2 não cria o índice HNSW
      # e a busca vetorial é sequencial, o que é rápido para os poucos trechos da demonstração.
      - key: EMBEDDING_DIMENSIONS
        value: "3072"

      # Demonstração pública: empresas fictícias, sem cadastro aberto.
      - key: DEMO_HABILITADA
        value: "true"
      - key: CADASTRO_ABERTO
        value: "false"
      - key: DEMO_LIMITE_PERGUNTAS_POR_HORA
        value: "200"

      # Cabe nos 512 MB e 0,1 CPU do plano gratuito: heap menor e compilação JIT mais leve, que sobe mais rápido.
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:ReservedCodeCacheSize=64m -Xss512k -Djava.awt.headless=true
