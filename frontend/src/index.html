<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Sabiá</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Assistente que responde perguntas com base nos documentos da empresa e mostra a fonte de cada resposta.">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121214" media="(prefers-color-scheme: dark)">
  <script>
    // Aplica o tema escolhido antes do Angular carregar, para a tela não piscar.
    try {
      var tema = localStorage.getItem('sabia.tema');
      if (tema === 'claro' || tema === 'escuro') document.documentElement.setAttribute('data-tema', tema);
    } catch (e) {}
  </script>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>
<body>
  <app-root></app-root>
</body>
</html>
